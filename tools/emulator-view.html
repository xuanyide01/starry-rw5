<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Galgame · Vela 虚拟手表</title>
<style>body{margin:0;background:#101927;color:#e6f1ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{display:flex;gap:48px;align-items:center;padding:24px}.watch{background:#030509;border:12px solid #303a48;border-radius:42px;box-shadow:0 24px 80px #0008;overflow:hidden;width:432px;height:514px}img{width:100%;height:100%;cursor:pointer;touch-action:none}aside{max-width:330px}h1{font-size:28px}p{line-height:1.7;color:#b2c4d9}button{display:block;width:220px;padding:12px;margin:12px 0;border:0;border-radius:10px;background:#284762;color:#fff;font-size:16px;cursor:pointer}#status{font-size:13px;min-height:42px;white-space:pre-wrap}@media(max-width:850px){main{flex-direction:column;gap:12px}.watch{width:345.6px;height:411.2px}aside{max-width:345px}}</style>
<main><div class="watch"><img id="screen" alt="官方 Vela 模拟器画面"></div><aside><h1 id="game">红米手表 5 虚拟测试</h1><p>这是官方 Vela 模拟器的实时画面。点击屏幕操作应用，拖动画面可滚动选项。</p><p>虚拟设备：432 × 514<br>应用：红米手表 5 图文版</p><button onclick="command('start')">启动应用</button><button onclick="command('stop')">停止应用</button><p id="status">正在连接模拟器…</p><p>图文、分支和存档可在这里验证；实际手表的性能与安装兼容性仍需真机测试。</p></aside></main>
<script>
const screen=document.querySelector('#screen'),status=document.querySelector('#status');let updating=false;
fetch('/info').then(r=>r.json()).then(info=>{const name=info.packageName.includes('summer')?'夏日口袋 REFLECTION BLUE':'星空列车与白的旅行';document.querySelector('#game').textContent=name+(info.packageName.includes('.qa')?' · 测试应用':'');document.title=name+' · Vela 虚拟手表';}).catch(()=>{});
async function command(endpoint){try{const r=await fetch('/'+endpoint);const d=await r.json();if(!r.ok)throw new Error(d.error);status.textContent=typeof d==='string'?(d||'操作完成'):JSON.stringify(d)}catch(e){status.textContent=e.message}}
let down=null;const point=e=>{const r=screen.getBoundingClientRect();return{x:Math.max(0,Math.min(431,Math.round((e.clientX-r.left)*432/r.width))),y:Math.max(0,Math.min(513,Math.round((e.clientY-r.top)*514/r.height)))}};
screen.addEventListener('pointerdown',e=>{down=point(e);screen.setPointerCapture(e.pointerId)});
screen.addEventListener('pointerup',async e=>{if(!down)return;const end=point(e),start=down;down=null;if(Math.hypot(end.x-start.x,end.y-start.y)>8)await command(`drag?x0=${start.x}&y0=${start.y}&x1=${end.x}&y1=${end.y}`);else await command(`click?x=${end.x}&y=${end.y}`)});
screen.addEventListener('dragstart',e=>e.preventDefault());screen.addEventListener('pointercancel',()=>down=null);
async function refresh(){if(updating)return;updating=true;try{const r=await fetch('/screen?t='+Date.now());if(!r.ok){const d=await r.json();throw new Error(d.error)}const blob=await r.blob(),url=URL.createObjectURL(blob),previous=screen.src;screen.src=url;if(previous.startsWith('blob:'))URL.revokeObjectURL(previous);if(status.textContent.startsWith('正在')||status.textContent.includes('registered'))status.textContent='模拟器已连接，可以点击屏幕。'}catch(e){status.textContent=e.message}finally{updating=false}}
setInterval(refresh,500);refresh();
</script></html>
